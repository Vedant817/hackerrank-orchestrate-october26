[project]
name = "ghostwatch"
version = "0.1.0"
description = "AI-powered deletion-audit agent for HackerRank Orchestrate October 2026 (Ghost Data Still Exists)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vedant Mahajan" }]
dependencies = [
    "pypdf>=5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["code/tests"]
